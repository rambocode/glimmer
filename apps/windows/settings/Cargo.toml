[package]
name = "glimmer-windows-settings"
description = "Windows 输入法的设置界面：左侧导航栏 + 各分节表单，读写 %APPDATA%\\Glimmer\\config.toml，对齐 macOS 偏好设置"
version = "0.1.0-alpha.7-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glimmer-settings"
path = "src/main.rs"

[dependencies]
glimmer-platform.workspace = true
glimmer-predict.workspace = true
toml_edit.workspace = true

# UI 本体只在 Windows 编
[target."cfg(windows)".dependencies]
windows-reactor = "0.100"
# 只用它的 system_fonts（DirectWrite 列字族）
glimmer-render.workspace = true
glimmer-learning.workspace = true
glimmer-core.workspace = true
glimmer-translate.workspace = true
jiff.workspace = true
rfd = "0.17"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
# 自包含部署 Windows App Runtime（Windows 10 上框架依赖的引导用不了，见 build.rs 与 docs\notes\windows-win10.md）
windows-reactor-setup = "0.100"

[lints]
workspace = true
