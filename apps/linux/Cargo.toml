[package]
name = "glimmer-linux"
description = "Linux 输入法：IBus 引擎进程（D-Bus），持有 Engine，把 IBus 按键翻成协议按键、把帧画成 IBus 的 preedit 与候选表"
version = "0.1.0-linux.3-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "glimmer-ibus"
path = "src/main.rs"

[dependencies]
glimmer-core.workspace = true
glimmer-platform.workspace = true
glimmer-server.workspace = true
dotenvy.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[lints]
workspace = true
