[package]
name = "glimmer-fcitx5"
description = "Linux Fcitx5 插件的 Rust 半边：把 glimmer-linux 的前端会话与 Router 包成 C 接口，静态链进 C++ 插件 glimmer.so"
version = "0.1.0-linux.2-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "glimmer_fcitx5"
crate-type = ["staticlib", "rlib"]

[dependencies]
glimmer-linux.workspace = true
tracing.workspace = true
tracing-appender.workspace = true

[lints]
workspace = true
