# 推 macos-v<版本> / windows-v<版本> / linux-v<版本> 标签触发（各平台壳版本号独立：macOS 读 apps/macos/Cargo.toml，Windows 读 apps/windows/server/Cargo.toml，
# Linux 读 apps/linux/Cargo.toml），
# 流程见 docs/notes/release.md。macOS 的签名与公证可选，下面的 Secrets 配齐才签，否则出 ad-hoc 包；
# Windows 现在没有代码签名（GLIMMER_UIACCESS=0 关掉 uiAccess，否则没签名的 Server 起不来），证书办下来再加 signtool。
#   GLIMMER_CERT_P12            Developer ID Application + Installer 两张证书（含私钥）导出的 .p12，base64
#   GLIMMER_CERT_PASSWORD       .p12 的密码
#   GLIMMER_SIGN_IDENTITY       "Developer ID Application: 名字 (TEAMID)"
#   GLIMMER_INSTALLER_IDENTITY  "Developer ID Installer: 名字 (TEAMID)"
#   GLIMMER_NOTARY_KEY          App Store Connect API 密钥 .p8，base64
#   GLIMMER_NOTARY_KEY_ID       密钥的 Key ID
#   GLIMMER_NOTARY_ISSUER       密钥的 Issuer ID
# 发版后让官网重新构建（也可选）：
#   GLIMMER_WEB_TOKEN           fine-grained PAT，对 rambocode/glimmer-web 有 Contents: read and write
#                                （官网由 Cloudflare 按仓库提交自动构建，tools/release/bump-website.sh 往那边推一个小提交）
#
# 门禁：版本号与标签一致且不带 -dev；标签指向的提交必须在 main 上（防止从没合并的分支或手滑的本地提交发版）。
# Secrets 不放 workflow 顶层 env，只注入真正用它的那一步；有没有配由第一步算成输出（secrets 不能直接写在 if 里）。
# actions 钉到 commit（注释是对应标签），Dependabot 每周更新；产品数据与本地整句模型按 tools/release/data.lock 钉住的 data-vN Release 下载、按锁文件里的哈希校验，标签与哈希记进 build-info.json。
name: release

on:
  push:
    tags: ['macos-v*', 'windows-v*', 'linux-v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    if: startsWith(github.ref_name, 'macos-v')
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bundle.sh 用提交数当构建号；门禁要看 main
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: |
          echo "sign=${{ secrets.GLIMMER_CERT_P12 != '' }}" >> "$GITHUB_OUTPUT"
          echo "notarize=${{ secrets.GLIMMER_NOTARY_KEY != '' }}" >> "$GITHUB_OUTPUT"
          echo "website=${{ secrets.GLIMMER_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/macos/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#macos-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/macos/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/model

      - name: Import signing certificates
        if: steps.secrets.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.GLIMMER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.GLIMMER_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.GLIMMER_SIGN_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.GLIMMER_INSTALLER_IDENTITY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          {
            echo "GLIMMER_SIGN_IDENTITY=$SIGN_IDENTITY"
            echo "GLIMMER_INSTALLER_IDENTITY=$INSTALLER_IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: steps.secrets.outputs.notarize == 'true'
        env:
          NOTARY_KEY: ${{ secrets.GLIMMER_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.GLIMMER_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.GLIMMER_NOTARY_ISSUER }}
        run: |
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials glimmer --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          echo "GLIMMER_NOTARY_PROFILE=glimmer" >> "$GITHUB_ENV"

      - name: Build pkg (arm64)
        run: GLIMMER_TARGET=aarch64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Build pkg (x86_64)
        run: GLIMMER_TARGET=x86_64-apple-darwin apps/macos/scripts/bundle.sh --pkg

      - name: Checksums and build info
        run: |
          cd target/pkg
          shasum -a 256 ./*.pkg | tee SHA256SUMS
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "macOS $(sw_vers -productVersion)" --arg data_tag "$DATA_TAG" --arg data_sha256 "$DATA_SHA256" --arg model_sha256 "$MODEL_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_tag: $data_tag, data_sha256: $data_sha256, model_sha256: $model_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.secrets.outputs.sign }}
        run: |
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          if [[ "$SIGNED" != "true" ]]; then
            printf '\n> 这一版没有 Apple 开发者签名，首次打开系统会拦一下：到「系统设置 → 隐私与安全性」底部点「仍要打开」再装一次。\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release create "$GITHUB_REF_NAME" --title "微明 $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/pkg/*.pkg target/pkg/SHA256SUMS target/pkg/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/pkg

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          GLIMMER_WEB_TOKEN: ${{ secrets.GLIMMER_WEB_TOKEN }}
        run: tools/release/bump-website.sh

  windows:
    if: startsWith(github.ref_name, 'windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # 没有代码签名证书：Server 不带 uiAccess（没签名的 exe 带 uiAccess=true 起不来）。证书办下来后去掉这一行并在 build.ps1 加 signtool。
      GLIMMER_UIACCESS: '0'
      PYTHON: python
      # Windows 上 Python 的标准输出缺省 cp1252，中文更新日志会编码失败。
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0
          # 安装包另带一份 32 位 TSF DLL（build.ps1 编）
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.GLIMMER_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/windows/server/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#windows-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/windows/server/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          ls -la data/generated data/generated/dicts data/model

      # 与开发机同版本（7.1.0，自带简体中文翻译；Chocolatey 只有 6.x，6 的安装包不带简中）。钉死 GitHub Release 上的文件。
      - name: Install Inno Setup 7.1.0
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe'
          # 下载来的安装程序要以管理员身份执行，先核对 SHA-256（2026-09-11 从上面地址下载后算出），对不上就不装。
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Inno Setup 安装程序 SHA-256 不符：$actual" }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait
          & "${env:ProgramFiles}\Inno Setup 7\ISCC.exe" --version

      - name: Build installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File apps\windows\installer\build.ps1

      - name: Checksums and build info
        run: |
          cd target/installer
          sha256sum ./*.exe | tee SHA256SUMS
          RUNNER_OS_NAME="$(powershell -NoProfile -Command '(Get-CimInstance Win32_OperatingSystem).Caption' | tr -d '\r')"
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "$RUNNER_OS_NAME" --arg data_tag "$DATA_TAG" --arg data_sha256 "$DATA_SHA256" --arg model_sha256 "$MODEL_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_tag: $data_tag, data_sha256: $data_sha256, model_sha256: $model_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          printf '\n> 内测版没有代码签名：安装时 SmartScreen 拦截请点「更多信息 → 仍要运行」；任务栏搜索、「设置」等系统应用里候选窗口可能被遮挡。\n' >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "微明 Windows $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/installer/*.exe target/installer/SHA256SUMS target/installer/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/installer

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          GLIMMER_WEB_TOKEN: ${{ secrets.GLIMMER_WEB_TOKEN }}
        run: tools/release/bump-website.sh

  # Linux：两半在不同系统上编，最后在 22.04 上合成 deb（amd64 与 arm64 各在原生 runner 上，不交叉编译），由 linux-release 汇总建 Release。
  #   linux-check    门禁（版本 = 标签、不带 -dev、标签在 main 上），其余 job 都 needs 它
  #   linux-ibus     Ubuntu 22.04 上编 glimmer-ibus：deb 的 Depends 只由它算，22.04 / Debian 12 起都能装
  #   linux-fcitx5   Ubuntu 24.04 上编 Fcitx5 插件（要 Fcitx5 5.1 开发包，22.04 没有），cmake --install 到目录
  #   linux-package  Ubuntu 22.04 上用两份预编产物跑 package.sh：dpkg-shlibdeps 在 22.04 上才算出 libssl3（24.04 是 libssl3t64）
  linux-check:
    if: startsWith(github.ref_name, 'linux-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 门禁要看 main
          fetch-depth: 0
          persist-credentials: false

      - name: Check version matches tag and tag is on main
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' apps/linux/Cargo.toml | head -1)"
          TAG="${GITHUB_REF_NAME#linux-v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "apps/linux/Cargo.toml 是 $VERSION，标签是 $GITHUB_REF_NAME，先改版本号再打标签" >&2
            exit 1
          fi
          if [[ "$VERSION" == *-dev ]]; then
            echo "$VERSION 还是开发版号，发版提交要先去掉 -dev（docs/notes/release.md）" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "标签 $GITHUB_REF_NAME 指向的提交 $GITHUB_SHA 不在 main 上，先合并再发" >&2
            exit 1
          fi

  linux-ibus:
    needs: linux-check
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Build glimmer-ibus
        run: |
          cargo build --release --locked -p glimmer-linux
          readelf -d target/release/glimmer-ibus | grep NEEDED

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibus-${{ matrix.arch }}
          path: target/release/glimmer-ibus
          if-no-files-found: error

  linux-fcitx5:
    needs: linux-check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
          cmake g++ extra-cmake-modules libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev

      # 与 package.sh 本机编插件同一套命令：前缀 /usr、资源根 /usr/lib/glimmer，装到 DESTDIR 目录交给 linux-package
      - name: Build Fcitx5 addon
        run: |
          cargo build --release --locked -p glimmer-fcitx5
          cmake -S apps/linux/fcitx5/addon -B "$RUNNER_TEMP/fcitx5-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DGLIMMER_RUST_LIB="$PWD/target/release/libglimmer_fcitx5.a" -DGLIMMER_DATA_ROOT=/usr/lib/glimmer
          cmake --build "$RUNNER_TEMP/fcitx5-build" -j "$(nproc)"
          DESTDIR="$RUNNER_TEMP/fcitx5-stage" cmake --install "$RUNNER_TEMP/fcitx5-build"
          find "$RUNNER_TEMP/fcitx5-stage" -type f
          readelf -d "$RUNNER_TEMP"/fcitx5-stage/usr/lib/*/fcitx5/glimmer.so | grep NEEDED

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fcitx5-${{ matrix.arch }}
          path: ${{ runner.temp }}/fcitx5-stage/
          if-no-files-found: error

  linux-package:
    needs: [linux-ibus, linux-fcitx5]
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ibus-${{ matrix.arch }}
          path: ${{ runner.temp }}/ibus

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fcitx5-${{ matrix.arch }}
          path: ${{ runner.temp }}/fcitx5-stage

      - name: Fetch product data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/generated data/model
          gh release download data --pattern glimmer-data.tar.gz --pattern model.qjm --pattern SHA256SUMS --dir data
          (cd data && grep -E 'glimmer-data.tar.gz|model.qjm' SHA256SUMS | sha256sum -c -)
          tar -xzf data/glimmer-data.tar.gz -C data/generated
          # 本地整句模型单文件：package.sh 见到 data/model/model.qjm 就装进 /usr/lib/glimmer/data/model
          mv data/model.qjm data/model/
          ls -la data/generated data/generated/dicts data/model

      # artifact 不保留可执行位，先补上；Depends 里出现 t64 说明依赖算在了 24.04 上，22.04 / Debian 12 装不了，直接失败
      - name: Build deb
        run: |
          chmod +x "$RUNNER_TEMP/ibus/glimmer-ibus"
          GLIMMER_IBUS_BIN="$RUNNER_TEMP/ibus/glimmer-ibus" GLIMMER_FCITX5_STAGE="$RUNNER_TEMP/fcitx5-stage" apps/linux/scripts/package.sh
          DEPENDS="$(dpkg-deb -f target/deb/*.deb Depends)"
          echo "Depends: $DEPENDS"
          if [[ "$DEPENDS" == *t64* ]]; then
            echo "Depends 带 t64，Ubuntu 22.04 / Debian 12 装不了" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.arch }}
          path: target/deb/*.deb
          if-no-files-found: error

  linux-release:
    if: startsWith(github.ref_name, 'linux-v')
    needs: linux-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.96.0

      - name: Detect optional secrets
        id: secrets
        run: echo "website=${{ secrets.GLIMMER_WEB_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: deb-*
          path: target/deb
          merge-multiple: true

      - name: Checksums and build info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#linux-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 两个 linux-package job 已按 data Release 的 SHA256SUMS 校验过下载的数据，这里直接取那份摘要记进 build-info.json
          gh release download data --pattern SHA256SUMS --dir "$RUNNER_TEMP/data"
          DATA_SHA256="$(awk '$2 ~ /glimmer-data\.tar\.gz$/ {print $1}' "$RUNNER_TEMP/data/SHA256SUMS")"
          MODEL_SHA256="$(awk '$2 ~ /model\.qjm$/ {print $1}' "$RUNNER_TEMP/data/SHA256SUMS")"
          cd target/deb
          ls -la
          debs=(./*.deb)
          test "${#debs[@]}" -eq 2
          sha256sum ./*.deb | tee SHA256SUMS
          jq -n --arg version "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            --arg built_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg toolchain "$(rustc --version)" \
            --arg runner "$(. /etc/os-release && echo "$PRETTY_NAME")（汇总机；IBus 引擎在 Ubuntu 22.04、Fcitx5 插件在 Ubuntu 24.04 上编，amd64 与 arm64 各自原生 runner）" \
            --arg data_sha256 "$DATA_SHA256" --arg model_sha256 "$MODEL_SHA256" \
            '{version: $version, tag: $tag, commit: $commit, built_at: $built_at, toolchain: $toolchain, runner: $runner, data_sha256: $data_sha256, model_sha256: $model_sha256}' \
            | tee build-info.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/releases_json.py --notes-for "$VERSION" > "$RUNNER_TEMP/notes.md"
          printf '\n> 同一个安装包支持 IBus 与 Fcitx5。安装：`sudo apt install ./Glimmer-%s-amd64.deb`（ARM 机器用 arm64 包）。IBus（Ubuntu 22.04、Debian 12 或更新）：运行 `ibus restart`，在「设置 → 键盘 → 输入源」里添加「微明」；Fcitx5（5.1 或更新）：运行 `fcitx5 -r`，在「Fcitx5 配置」里把「微明」加进输入法列表。\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --title "微明 Linux $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            target/deb/*.deb target/deb/SHA256SUMS target/deb/build-info.json

      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/publish-releases-json.sh "$GITHUB_REF_NAME" target/deb

      - name: Trigger website build
        if: steps.secrets.outputs.website == 'true'
        env:
          GLIMMER_WEB_TOKEN: ${{ secrets.GLIMMER_WEB_TOKEN }}
        run: tools/release/bump-website.sh
