[workspace]
resolver = "3"
members = [
    "crates/glimmer-core",
    "crates/glimmer-dictionary",
    "crates/glimmer-translate",
    "crates/glimmer-learning",
    "crates/glimmer-platform",
    "crates/glimmer-predict",
    "crates/glimmer-lm",
    "crates/glimmer-format",
    "crates/glimmer-neural",
    "crates/glimmer-server",
    "crates/glimmer-render",
    "crates/glimmer-update",
    "apps/cli", "apps/macos", "apps/windows/server", "apps/windows/tsf", "apps/windows/settings", "apps/linux", "apps/linux/fcitx5", "tools/dict-convert", "tools/gloss-gen",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rambocode/glimmer"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# 内部 crate
glimmer-core = { path = "crates/glimmer-core" }
glimmer-dictionary = { path = "crates/glimmer-dictionary" }
glimmer-translate = { path = "crates/glimmer-translate" }
glimmer-learning = { path = "crates/glimmer-learning" }
glimmer-platform = { path = "crates/glimmer-platform" }
glimmer-predict = { path = "crates/glimmer-predict" }
glimmer-lm = { path = "crates/glimmer-lm" }
glimmer-format = { path = "crates/glimmer-format" }
glimmer-neural = { path = "crates/glimmer-neural" }
glimmer-server = { path = "crates/glimmer-server" }
glimmer-linux = { path = "apps/linux" }
glimmer-render = { path = "crates/glimmer-render" }
glimmer-update = { path = "crates/glimmer-update" }

# 外部依赖统一在这里定版本，子 crate 一律 `xxx.workspace = true`
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
dotenvy = "0.15.7"
clap = { version = "4.6.6", features = ["derive", "env"] }
serde_json = "1.0.151"
toml = "1.1.5"
toml_edit = "0.25"
# 快捷候选的日期 / 时间（本地时区）
jiff = "0.2.35"
plist = "1.7"
# 热路径上的字符串键哈希表（词频 / 语言模型 / 个人 n-gram）：SipHash 一次查表几十纳秒，单字母简拼一键要查几万次
foldhash = "0.2.0"
# 繁体输出（OpenCC s2tw，内置词表）；只要简→繁那半
ferrous-opencc = { version = "0.4.0", default-features = false, features = ["s2t-conversion"] }
# .qj 数据容器：mmap 打开、结构体数组零拷贝读取
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }

# 本地神经语言模型推理（字级 Transformer，权重 safetensors）
candle-core = "0.11.0"
candle-nn = "0.11.0"

# 云联想：OpenAI 兼容接口客户端与它需要的异步运行时
async-openai = { version = "0.42.0", default-features = false, features = ["chat-completion", "native-tls"] }
reqwest = { version = "0.13", default-features = false }
uuid = { version = "1.26", features = ["v4"] }
# 检查更新：下载的安装包按发版清单里的 sha256 校验
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["rt", "time"] }

# 自绘渲染器：CPU 栅格 + 文字整形/回退/栅格（fontdb / rustybuzz / swash）
tiny-skia = "0.12.0"
# 不开 fontconfig：不扫系统字体库，字体文件由渲染器按平台清单自己加载
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash"] }
png = "0.18.1"

# macOS 平台层
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSAttributedString", "NSBundle", "NSDictionary", "NSGeometry", "NSObject", "NSProcessInfo", "NSRange", "NSString", "NSTimer", "NSURL", "NSUserDefaults", "NSValue"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSAttributedString", "NSEvent", "NSBezierPath", "NSColor", "NSFont", "NSGraphics", "NSImage", "NSPanel", "NSResponder", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPasteboard", "NSSavePanel", "NSCell", "NSPopUpButton", "NSTextField", "NSSecureTextField", "NSTextFieldCell", "NSActionCell", "NSRunningApplication", "NSAppearance", "NSText", "NSButton", "NSButtonCell", "NSControl", "NSStringDrawing", "NSTabView", "NSTabViewItem", "NSView", "NSWindow", "NSScrollView", "NSClipView", "NSTextView", "NSTableView", "NSTableColumn", "NSTableHeaderView", "NSTableHeaderCell", "NSTableCellView", "NSImageView", "NSImageCell", "NSVisualEffectView", "NSBox", "NSParagraphStyle", "block2", "NSBitmapImageRep", "NSImageRep", "NSFontManager", "NSPopover", "NSSearchField", "NSSearchFieldCell", "NSViewController"] }
objc2-input-method-kit = "0.3.2"
# 候选窗字体设置：按字族名找字体文件（渲染器只加载指定文件）
objc2-core-text = { version = "0.3.2", features = ["CTFont", "CTFontDescriptor"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFArray", "CFBase", "CFDictionary", "CFNumber", "CFSet", "CFString", "CFURL"] }

# Windows 平台层
embed-manifest = "1.4.0"
windows-registry = "0.6.1"

# cosmic-text 加了 opsz 光学字号支持（FontSystem::set_optical_size），补丁在 rambocode 的 fork，分支 glimmer-opsz 基于 0.19.0；
# 上游收了就删掉这段回 crates.io。见 docs/design/rendering.md
[patch.crates-io]
cosmic-text = { git = "https://github.com/qingjian-team/cosmic-text", rev = "9cf0d65a5e4db381e34907103326673386096be3" }
